<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ĐỒ ÁN: XE TỰ HÀNH</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%C4%90%E1%BB%92%20%C3%81N%3A%20XE%20T%E1%BB%B0%20H%C3%80NH%22%2C%22short_name%22%3A%22Xe%20Robot%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 17px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }
    .sub-title {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .status-card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-text.connected {
      color: #22c55e;
    }
    .btn-connect {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    }
    .btn-connect:active {
      transform: scale(0.96);
    }
    /* Chế độ */
    .mode-container {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-mode {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-auto {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 12px rgba(245,158,11,0.3);
    }
    .btn-manual {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 4px 12px rgba(139,92,246,0.3);
    }
    /* Cụm D-PAD */
    .controller-grid {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    .ctrl-btn {
      aspect-ratio: 1;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      color: #38bdf8;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
    }
    .ctrl-btn span {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 600;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 20px #0284c7;
      transform: scale(0.92);
    }
    .btn-brake {
      background: #991b1b;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-brake:active {
      background: #dc2626;
      box-shadow: 0 0 20px #dc2626;
    }
    /* Còi */
    .btn-horn {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(234,179,8,0.4);
      cursor: pointer;
    }
    .btn-horn:active {
      transform: scale(0.96);
      background: #facc15;
    }
    .log-box {
      width: 100%;
      max-width: 420px;
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚗 ĐỒ ÁN TỐT NGHIỆP</h1>
    <div class="sub-title">XE TỰ HÀNH & ĐIỀU KHIỂN BLUETOOTH LE</div>
  </header>

  <div class="status-card">
    <div class="status-text" id="statusIndicator">
      <span style="font-size: 16px;">●</span> <span id="statusText">Chưa kết nối</span>
    </div>
    <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">📶 KẾT NỐI XE</button>
  </div>

  <div class="mode-container">
    <button class="btn-mode btn-auto" onclick="sendCharacter('a')">
      🤖 TỰ ĐỘNG (AUTO)
    </button>
    <button class="btn-mode btn-manual" onclick="sendCharacter('m')">
      🎮 LÁI TAY (MANUAL)
    </button>
  </div>

  <div class="controller-grid">
    <div></div>
    <button class="ctrl-btn" id="btnForward" 
      ontouchstart="handleTouch('f', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('f', this, event)" onmouseup="handleTouchEnd(this, event)">
      ▲<span>TIẾN</span>
    </button>
    <div></div>

    <button class="ctrl-btn" id="btnLeft" 
      ontouchstart="handleTouch('l', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('l', this, event)" onmouseup="handleTouchEnd(this, event)">
      ◀<span>TRÁI</span>
    </button>

    <button class="ctrl-btn btn-brake" onclick="sendCharacter('s')">
      ■<span>PHANH</span>
    </button>

    <button class="ctrl-btn" id="btnRight" 
      ontouchstart="handleTouch('r', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('r', this, event)" onmouseup="handleTouchEnd(this, event)">
      ▶<span>PHẢI</span>
    </button>

    <div></div>
    <button class="ctrl-btn" id="btnBackward" 
      ontouchstart="handleTouch('b', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('b', this, event)" onmouseup="handleTouchEnd(this, event)">
      ▼<span>LÙI</span>
    </button>
    <div></div>
  </div>

  <button class="btn-horn" onclick="sendCharacter('h')">
    🔔 BẤM CÒI XE (HORN)
  </button>

  <div class="log-box" id="logBox">Sẵn sàng kết nối Bluetooth</div>

  <script>
    let bleDevice = null;
    let writeChar = null;

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        onDisconnected();
        return;
      }
      try {
        log("Đang mở hộp thoại quét...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            0xFFE0,
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            0xFFF0,
            '0000fff0-0000-1000-8000-00805f9b34fb'
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Đang kết nối: " + bleDevice.name + "...");
        const server = await bleDevice.gatt.connect();

        log("Đang tự động dò cổng truyền dữ liệu...");
        const services = await server.getPrimaryServices();
        writeChar = null;

        for (const s of services) {
          const chars = await s.getCharacteristics();
          for (const c of chars) {
            // Tìm characteristic có quyền ghi
            if (c.properties.writeWithoutResponse || c.properties.write) {
              writeChar = c;
              break;
            }
          }
          if (writeChar) break;
        }

        if (!writeChar) {
          // Thử lấy cổng FFE1 mặc định nếu duyệt không thấy
          const s = await server.getPrimaryService(0xFFE0);
          writeChar = await s.getCharacteristic(0xFFE1);
        }

        onConnected();
      } catch (err) {
        log("Lỗi kết nối: " + err.message);
        alert("Lỗi kết nối: " + err.message);
      }
    }

    async function onConnected() {
      document.getElementById('statusIndicator').className = 'status-text connected';
      document.getElementById('statusText').innerText = "Đã kết nối: " + (bleDevice.name || "HC-05");
      document.getElementById('btnConnect').innerText = "NGẮT";
      document.getElementById('btnConnect').style.background = "#ef4444";
      log("Kết nối thành công! Đang kích hoạt xe...");
      
      // Chờ 500ms để ổn định GATT rồi tự động bật chế độ Lái tay và Bíp còi
      setTimeout(async () => {
        await sendCharacter('m'); // Bật lái tay
        await sendCharacter('h'); // Bíp còi chào mừng
        log("Xe đã sẵn sàng lái tay!");
      }, 600);
    }

    function onDisconnected() {
      document.getElementById('statusIndicator').className = 'status-text';
      document.getElementById('statusText').innerText = "Chưa kết nối";
      document.getElementById('btnConnect').innerText = "📶 KẾT NỐI XE";
      document.getElementById('btnConnect').style.background = "#2563eb";
      writeChar = null;
      log("Đã ngắt kết nối xe.");
    }

    async function sendCharacter(ch) {
      if (!writeChar) {
        log("Chưa kết nối xe!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(ch);
        if (writeChar.properties.writeWithoutResponse) {
          await writeChar.writeValueWithoutResponse(data);
        } else {
          await writeChar.writeValue(data);
        }
        log("Đã gửi lệnh: '" + ch + "'");
      } catch (err) {
        log("Lỗi gửi: " + err.message);
      }
    }

    function handleTouch(cmd, btn, e) {
      if (e) e.preventDefault();
      btn.classList.add('active');
      sendCharacter(cmd);
      if (navigator.vibrate) navigator.vibrate(35);
    }

    function handleTouchEnd(btn, e) {
      if (e) e.preventDefault();
      btn.classList.remove('active');
      sendCharacter('s'); // Dừng khi nhả ngón tay
    }

    function log(msg) {
      document.getElementById('logBox').innerText = msg;
    }
  </script>
</body>
</html>
