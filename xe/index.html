<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ĐỒ ÁN: ĐIỀU KHIỂN XE TỰ HÀNH</title>
  <meta name="theme-color" content="#121826">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 18px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }
    .sub-title {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .status-card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-text.connected {
      color: #22c55e;
    }
    .btn-connect {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    }
    .btn-connect:active {
      transform: scale(0.96);
    }
    /* Chế độ */
    .mode-container {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-mode {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-auto {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 12px rgba(245,158,11,0.3);
    }
    .btn-manual {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 4px 12px rgba(139,92,246,0.3);
    }
    /* Cụm D-PAD */
    .controller-grid {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .ctrl-btn {
      aspect-ratio: 1;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      color: #38bdf8;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
    }
    .ctrl-btn span {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 600;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 20px #0284c7;
      transform: scale(0.92);
    }
    .btn-brake {
      background: #991b1b;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-brake:active {
      background: #dc2626;
      box-shadow: 0 0 20px #dc2626;
    }
    /* Còi */
    .btn-horn {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(234,179,8,0.4);
      cursor: pointer;
    }
    .btn-horn:active {
      transform: scale(0.96);
      background: #facc15;
    }
    .log-box {
      width: 100%;
      max-width: 420px;
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚗 ĐỒ ÁN TỐT NGHIỆP</h1>
    <div class="sub-title">XE TỰ HÀNH & ĐIỀU KHIỂN BLUETOOTH LE</div>
  </header>

  <div class="status-card">
    <div class="status-text" id="statusIndicator">
      <span style="font-size: 16px;">●</span> <span id="statusText">Chưa kết nối</span>
    </div>
    <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">📶 KẾT NỐI XE</button>
  </div>

  <div class="mode-container">
    <button class="btn-mode btn-auto" onclick="sendCharacter('a')">
      🤖 TỰ ĐỘNG (AUTO)
    </button>
    <button class="btn-mode btn-manual" onclick="sendCharacter('m')">
      🎮 LÁI TAY (MANUAL)
    </button>
  </div>

  <div class="controller-grid">
    <div></div>
    <button class="ctrl-btn" id="btnForward" 
      ontouchstart="handleTouch('f', this)" ontouchend="handleTouchEnd(this)"
      onmousedown="handleTouch('f', this)" onmouseup="handleTouchEnd(this)">
      ▲<span>TIẾN</span>
    </button>
    <div></div>

    <button class="ctrl-btn" id="btnLeft" 
      ontouchstart="handleTouch('l', this)" ontouchend="handleTouchEnd(this)"
      onmousedown="handleTouch('l', this)" onmouseup="handleTouchEnd(this)">
      ◀<span>TRÁI</span>
    </button>

    <button class="ctrl-btn btn-brake" onclick="sendCharacter('s')">
      ■<span>PHANH</span>
    </button>

    <button class="ctrl-btn" id="btnRight" 
      ontouchstart="handleTouch('r', this)" ontouchend="handleTouchEnd(this)"
      onmousedown="handleTouch('r', this)" onmouseup="handleTouchEnd(this)">
      ▶<span>PHẢI</span>
    </button>

    <div></div>
    <button class="ctrl-btn" id="btnBackward" 
      ontouchstart="handleTouch('b', this)" ontouchend="handleTouchEnd(this)"
      onmousedown="handleTouch('b', this)" onmouseup="handleTouchEnd(this)">
      ▼<span>LÙI</span>
    </button>
    <div></div>
  </div>

  <button class="btn-horn" onclick="sendCharacter('h')">
    🔔 BẤM CÒI XE (HORN)
  </button>

  <div class="log-box" id="logBox">Hệ thống sẵn sàng kết nối</div>

  <script>
    let bleDevice = null;
    let bleCharacteristic = null;
    const SERVICE_UUID = 0xFFE0;
    const CHARACTERISTIC_UUID = 0xFFE1;

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        onDisconnected();
        return;
      }
      try {
        log("Đang quét thiết bị...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            SERVICE_UUID,
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            0xFFE0
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Đang kết nối: " + bleDevice.name);
        const server = await bleDevice.gatt.connect();

        log("Đang tìm dịch vụ BLE...");
        let service;
        try {
          service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
        } catch (e) {
          service = await server.getPrimaryService(SERVICE_UUID);
        }

        try {
          bleCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
        } catch (e) {
          bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        }

        onConnected();
      } catch (err) {
        log("Lỗi: " + err.message);
        alert("Không thể kết nối: " + err.message);
      }
    }

    function onConnected() {
      document.getElementById('statusIndicator').className = 'status-text connected';
      document.getElementById('statusText').innerText = "Đã kết nối: " + (bleDevice.name || "Xe Robot");
      document.getElementById('btnConnect').innerText = "NGẮT";
      document.getElementById('btnConnect').style.background = "#ef4444";
      log("Kết nối thành công! Sẵn sàng điều khiển.");
      // Bíp báo hiệu
      sendCharacter('h');
    }

    function onDisconnected() {
      document.getElementById('statusIndicator').className = 'status-text';
      document.getElementById('statusText').innerText = "Chưa kết nối";
      document.getElementById('btnConnect').innerText = "📶 KẾT NỐI XE";
      document.getElementById('btnConnect').style.background = "#2563eb";
      bleCharacteristic = null;
      log("Đã ngắt kết nối.");
    }

    async function sendCharacter(ch) {
      if (!bleCharacteristic) {
        log("Chưa kết nối xe!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(ch);
        if (bleCharacteristic.writeValueWithoutResponse) {
          await bleCharacteristic.writeValueWithoutResponse(data);
        } else {
          await bleCharacteristic.writeValue(data);
        }
        log("Đã gửi: '" + ch + "'");
      } catch (err) {
        log("Lỗi gửi lệnh: " + err.message);
      }
    }

    function handleTouch(cmd, btn) {
      btn.classList.add('active');
      sendCharacter(cmd);
      if (navigator.vibrate) navigator.vibrate(30); // Rung nhẹ tạo cảm giác
    }

    function handleTouchEnd(btn) {
      btn.classList.remove('active');
      sendCharacter('s'); // Tự phanh dừng khi nhả tay
    }

    function log(msg) {
      document.getElementById('logBox').innerText = msg;
    }
  </script>
</body>
</html>
