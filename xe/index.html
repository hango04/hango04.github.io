<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ĐỒ ÁN: XE TỰ HÀNH & ĐIỀU KHIỂN</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 8px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 17px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }
    .sub-title {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .status-card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-text.connected {
      color: #22c55e;
    }
    .btn-connect {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    }
    .btn-connect:active {
      transform: scale(0.96);
    }
    /* Chế độ */
    .mode-container {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-mode {
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-auto {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 12px rgba(245,158,11,0.3);
    }
    .btn-manual {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 4px 12px rgba(139,92,246,0.3);
    }
    /* Cụm D-PAD */
    .controller-grid {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .ctrl-btn {
      aspect-ratio: 1;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      color: #38bdf8;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
    }
    .ctrl-btn span {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 600;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 20px #0284c7;
      transform: scale(0.92);
    }
    .btn-brake {
      background: #991b1b;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-brake:active {
      background: #dc2626;
      box-shadow: 0 0 20px #dc2626;
    }
    /* Các nút tính năng mới */
    .action-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-horn {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(234,179,8,0.3);
      cursor: pointer;
    }
    .btn-voice {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(6,182,212,0.3);
      cursor: pointer;
    }
    .btn-voice.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .btn-tilt {
      background: #1e293b;
      border: 2px solid #475569;
      color: #94a3b8;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-tilt.active {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 4px 16px rgba(16,185,129,0.4);
    }
    .btn-horn:active, .btn-voice:active, .btn-tilt:active {
      transform: scale(0.97);
    }
    .log-box {
      width: 100%;
      max-width: 420px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚗 ĐỒ ÁN TỐT NGHIỆP</h1>
    <div class="sub-title">XE TỰ HÀNH & ĐIỀU KHIỂN BLUETOOTH LE</div>
  </header>

  <div class="status-card">
    <div class="status-text" id="statusIndicator">
      <span style="font-size: 16px;">●</span> <span id="statusText">Chưa kết nối</span>
    </div>
    <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">📶 KẾT NỐI XE</button>
  </div>

  <div class="mode-container">
    <button class="btn-mode btn-auto" onclick="sendCharacter('a')">
      🤖 TỰ ĐỘNG (AUTO)
    </button>
    <button class="btn-mode btn-manual" onclick="sendCharacter('m')">
      🎮 LÁI TAY (MANUAL)
    </button>
  </div>

  <div class="controller-grid">
    <div></div>
    <button class="ctrl-btn" id="btnForward" 
      ontouchstart="handleTouch('f', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('f', this, event)" onmouseup="handleTouchEnd(this, event)">
      ▲<span>TIẾN</span>
    </button>
    <div></div>

    <button class="ctrl-btn" id="btnLeft" 
      ontouchstart="handleTouch('l', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('l', this, event)" onmouseup="handleTouchEnd(this, event)">
      ◀<span>TRÁI</span>
    </button>

    <button class="ctrl-btn btn-brake" onclick="sendCharacter('s')">
      ■<span>PHANH</span>
    </button>

    <button class="ctrl-btn" id="btnRight" 
      ontouchstart="handleTouch('r', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('r', this, event)" onmouseup="handleTouchEnd(this, event)">
      ▶<span>PHẢI</span>
    </button>

    <div></div>
    <button class="ctrl-btn" id="btnBackward" 
      ontouchstart="handleTouch('b', this, event)" ontouchend="handleTouchEnd(this, event)"
      onmousedown="handleTouch('b', this, event)" onmouseup="handleTouchEnd(this, event)">
      ▼<span>LÙI</span>
    </button>
    <div></div>
  </div>

  <div class="action-container">
    <button class="btn-horn" onclick="sendCharacter('h')">
      🔔 BẤM CÒI XE (HORN)
    </button>

    <!-- Nút Điều khiển Giọng nói -->
    <button class="btn-voice" id="btnVoice" onclick="toggleVoice()">
      🎙️ NÓI LỆNH ĐIỀU KHIỂN
    </button>

    <!-- Nút Lái bằng Nghiêng điện thoại -->
    <button class="btn-tilt" id="btnTilt" onclick="toggleTilt()">
      📱 BẬT LÁI NGHIÊNG (CẢM BIẾN)
    </button>
  </div>

  <div class="log-box" id="logBox">Sẵn sàng kết nối Bluetooth</div>

  <script>
    let bleDevice = null;
    let writeChar = null;

    // --- KẾT NỐI BLUETOOTH LE ---
    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        onDisconnected();
        return;
      }
      try {
        log("Đang mở hộp thoại quét BLE...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            0xFFE0,
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            0xFFF0,
            '0000fff0-0000-1000-8000-00805f9b34fb'
          ]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Đang kết nối: " + bleDevice.name + "...");
        const server = await bleDevice.gatt.connect();

        log("Đang tự động dò cổng truyền dữ liệu...");
        const services = await server.getPrimaryServices();
        writeChar = null;

        for (const s of services) {
          const chars = await s.getCharacteristics();
          for (const c of chars) {
            if (c.properties.writeWithoutResponse || c.properties.write) {
              writeChar = c;
              break;
            }
          }
          if (writeChar) break;
        }

        if (!writeChar) {
          const s = await server.getPrimaryService(0xFFE0);
          writeChar = await s.getCharacteristic(0xFFE1);
        }

        onConnected();
      } catch (err) {
        log("Lỗi kết nối: " + err.message);
        alert("Lỗi kết nối: " + err.message);
      }
    }

    async function onConnected() {
      document.getElementById('statusIndicator').className = 'status-text connected';
      document.getElementById('statusText').innerText = "Đã kết nối: " + (bleDevice.name || "HC-05");
      document.getElementById('btnConnect').innerText = "NGẮT";
      document.getElementById('btnConnect').style.background = "#ef4444";
      log("✅ Đã kết nối xe thành công!");

      setTimeout(async () => {
        await sendCharacter('m'); // Bật lái tay
        await sendCharacter('h'); // Bíp còi chào mừng
        log("Xe đã sẵn sàng lái tay!");
      }, 500);
    }

    function onDisconnected() {
      document.getElementById('statusIndicator').className = 'status-text';
      document.getElementById('statusText').innerText = "Chưa kết nối";
      document.getElementById('btnConnect').innerText = "📶 KẾT NỐI XE";
      document.getElementById('btnConnect').style.background = "#2563eb";
      writeChar = null;
      if (tiltActive) toggleTilt(); // Tắt lái nghiêng nếu mất kết nối
      log("Đã ngắt kết nối xe.");
    }

    async function sendCharacter(ch) {
      if (!writeChar) {
        log("Chưa kết nối xe!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(ch);
        if (writeChar.properties.writeWithoutResponse) {
          await writeChar.writeValueWithoutResponse(data);
        } else {
          await writeChar.writeValue(data);
        }
        log("Lệnh: '" + ch + "'");
      } catch (err) {
        log("Lỗi gửi: " + err.message);
      }
    }

    function handleTouch(cmd, btn, e) {
      if (e) e.preventDefault();
      btn.classList.add('active');
      sendCharacter(cmd);
      if (navigator.vibrate) navigator.vibrate(35);
    }

    function handleTouchEnd(btn, e) {
      if (e) e.preventDefault();
      btn.classList.remove('active');
      sendCharacter('s'); // Dừng khi nhả ngón tay
    }

    function log(msg) {
      document.getElementById('logBox').innerText = msg;
    }

    // ============================================================
    //  TÍNH NĂNG 1: ĐIỀU KHIỂN BẰNG GIỌNG NÓI (VOICE CONTROL)
    // ============================================================
    let recognition = null;
    let isListening = false;

    function initVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói! Bác dùng trình duyệt Chrome nhé.");
        return null;
      }
      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.interimResults = false;
      rec.lang = 'vi-VN'; // Mặc định tiếng Việt, nhận diện cả từ tiếng Anh

      rec.onstart = () => {
        isListening = true;
        document.getElementById('btnVoice').classList.add('listening');
        document.getElementById('btnVoice').innerText = "🔴 Đang nghe... Hãy nói lệnh!";
        log("🎙️ Đang nghe giọng nói của bác...");
        sendCharacter('m'); // Tự động ngắt tự động, chuyển sang lái tay
      };

      rec.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        log("Bạn nói: \"" + text + "\"");

        // Nhận diện Tiếng Việt & Tiếng Anh
        if (text.includes("tiến") || text.includes("chạy") || text.includes("tới") || text.includes("go") || text.includes("forward")) {
          sendCharacter('f');
        } else if (text.includes("lùi") || text.includes("back") || text.includes("backward")) {
          sendCharacter('b');
        } else if (text.includes("trái") || text.includes("left")) {
          sendCharacter('l');
        } else if (text.includes("phải") || text.includes("right")) {
          sendCharacter('r');
        } else if (text.includes("dừng") || text.includes("phanh") || text.includes("stop") || text.includes("đỗ")) {
          sendCharacter('s');
        } else if (text.includes("còi") || text.includes("horn") || text.includes("kêu") || text.includes("bíp")) {
          sendCharacter('h');
        } else if (text.includes("auto") || text.includes("tự động")) {
          sendCharacter('a');
        } else if (text.includes("tay") || text.includes("thủ công") || text.includes("manual")) {
          sendCharacter('m');
        } else {
          log("Không nhận diện được lệnh: \"" + text + "\"");
        }
      };

      rec.onerror = (e) => {
        log("Lỗi giọng nói: " + e.error);
      };

      rec.onend = () => {
        isListening = false;
        document.getElementById('btnVoice').classList.remove('listening');
        document.getElementById('btnVoice').innerText = "🎙️ NÓI LỆNH ĐIỀU KHIỂN";
      };

      return rec;
    }

    function toggleVoice() {
      if (!writeChar) {
        alert("Vui lòng bấm 'KẾT NỐI XE' trước khi ra lệnh bằng giọng nói!");
        return;
      }
      if (!recognition) recognition = initVoice();
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    }

    // ============================================================
    //  TÍNH NĂNG 2: LÁI BẰNG CẢM BIẾN NGHIÊNG (TILT SENSOR)
    // ============================================================
    let tiltActive = false;
    let lastTiltCmd = 's';
    let baseBeta = 0;

    async function toggleTilt() {
      if (!writeChar && !tiltActive) {
        alert("Vui lòng bấm 'KẾT NỐI XE' trước khi bật lái nghiêng!");
        return;
      }

      tiltActive = !tiltActive;
      const btn = document.getElementById('btnTilt');

      if (tiltActive) {
        // Cần cấp quyền trên iOS nếu có
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const resp = await DeviceOrientationEvent.requestPermission();
            if (resp !== 'granted') {
              alert("Chưa cấp quyền cảm biến nghiêng!");
              tiltActive = false;
              return;
            }
          } catch (e) {}
        }

        btn.classList.add('active');
        btn.innerText = "📱 ĐANG LÁI NGHIÊNG (BẤM ĐỂ TẮT)";
        baseBeta = null; // Tự động lấy góc cầm tự nhiên của tay
        lastTiltCmd = 's';
        sendCharacter('m'); // Chuyển sang lái tay
        window.addEventListener('deviceorientation', handleOrientation);
        log("Đã bật lái nghiêng! Giữ điện thoại nghiêng để lái.");
      } else {
        btn.classList.remove('active');
        btn.innerText = "📱 BẬT LÁI NGHIÊNG (CẢM BIẾN)";
        window.removeEventListener('deviceorientation', handleOrientation);
        sendCharacter('s'); // Dừng xe ngay lập tức
        lastTiltCmd = 's';
        log("Đã tắt lái nghiêng. Xe đã dừng.");
      }
    }

    function handleOrientation(e) {
      if (!tiltActive) return;

      const beta = e.beta;   // Nghiêng chúc trước / ngửa sau [-180, 180]
      const gamma = e.gamma; // Nghiêng trái / phải [-90, 90]

      if (beta === null || gamma === null) return;

      // Lưu góc cầm ban đầu của tay để không bị mỏi
      if (baseBeta === null) {
        baseBeta = beta;
        return;
      }

      const diffBeta = beta - baseBeta;
      let currentCmd = 's';

      // Ngưỡng nghiêng 15 độ
      if (gamma < -18) {
        currentCmd = 'l'; // Nghiêng sang trái -> Trái
      } else if (gamma > 18) {
        currentCmd = 'r'; // Nghiêng sang phải -> Phải
      } else if (diffBeta > 18) {
        currentCmd = 'f'; // Chúi đầu máy xuống đất -> TIẾN (theo yêu cầu của bác)
      } else if (diffBeta < -18) {
        currentCmd = 'b'; // Ngửa máy về người mình -> LÙI
      } else {
        currentCmd = 's'; // Thẳng máy -> DỪNG
      }

      // CHỐNG NGHẼN SÓNG: Chỉ gửi khi thay đổi hướng!
      if (currentCmd !== lastTiltCmd) {
        lastTiltCmd = currentCmd;
        sendCharacter(currentCmd);

        const dict = { 'f': 'TIẾN ▲', 'b': 'LÙI ▼', 'l': 'TRÁI ◀', 'r': 'PHẢI ▶', 's': 'DỪNG ■' };
        log("Lái nghiêng: " + dict[currentCmd]);
      }
    }
  </script>
</body>
</html>
